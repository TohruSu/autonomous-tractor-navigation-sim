name: Navigation simulation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Restore, build, and validate navigation simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out the standalone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the SDK pinned by the project
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: false

      - name: Run the complete validation workflow
        run: bash scripts/validate.sh

      - name: Confirm committed synthetic visualization is reproducible
        run: |
          dotnet run --project src/TractorNavigation.Cli -c Release --no-build -- simulate --output artifacts/chart-preview
          python3 scripts/plot_trajectories.py --samples artifacts/chart-preview/samples.csv --summary artifacts/chart-preview/summary.csv --output artifacts/chart-preview.svg
          cmp docs/images/tracking-comparison.svg artifacts/chart-preview.svg
